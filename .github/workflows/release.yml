name: Release

# Push a tag like v0.1.0 to publish to the VS Code Marketplace and create a GitHub release.
# Requires the repository secret VSCE_PAT (Azure DevOps token with Marketplace > Manage scope).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for details."
        env:
          GH_TOKEN: ${{ github.token }}
